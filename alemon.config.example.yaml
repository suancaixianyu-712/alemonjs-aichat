# alemon.config.yaml

# 插件配置项，具体配置项说明见插件文档
aiChat:
  searchApiKey: '63706fc3e6827a90e8219913297b510ff053d5238b24f64251a066e4ecea7408'
  # PS功能图片代理地址, 将 https://imgen.x.ai 替换为你的代理地址, 如果你的服务器能正常问可以选填
  xaiImgProxy: 'https://imgen.x.ai'
  # 语音回复服务器地址，启用语音回复功能后必填
  ttsServer:
    host: "http://127.0.0.1:8005"
  # Redis 配置项，如果已经配置过可忽略, 如果需要单独为插件配置 Redis 连接，可以在这里覆盖全局的 Redis 配置(仅在插件中使用)，如果不需要可以留空或者删除
  redis:
    host: '127.0.0.1'
    port: 6379
    user: ''
    password: ''
  baidu:
    ak: ''
    sk: ''
  skills_dir: ['./skills']

# 全局redis配置项，如果插件中没有单独配置redis连接，可以使用全局的redis配置
redis:
  host: '127.0.0.1'
  port: 6379
  user: ''
  password: ''

apps:
  - alemonjs-aichat

# 登录方式
# 具体支持的登录方式见https://alemonjs.com/docs/environment
login: onebot
 
# 连接onebot平台
# 详细配置请参考https://github.com/lemonade-lab/alemonjs/blob/main/packages/onebot/README.md
onebot:
  url: 'ws://127.0.0.1:3001' # 正向url
  token: '' # access_token
  reverse_enable: false # 启用后正向连接配置失效，地址：ws://127.0.0.1:17158
  reverse_port: 17158 # 返向连接服务端口，启用反向连接后生效
  master_id: ['3501869534'] # 主人QQ号列表
